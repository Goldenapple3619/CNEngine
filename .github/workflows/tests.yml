name: tests

on: [push, pull_request]

jobs:
  test-linux-amd64:
    runs-on: ubuntu-latest
    needs: build-linux-amd64
  
    steps:
      - uses: actions/checkout@v2
      - name: Download build artifact
        uses: actions/download-artifact@v3
        with:
          name: dist-linux-amd64
          path: ./dist
      - name: Run tests
        run: |
          ls -R ./dist