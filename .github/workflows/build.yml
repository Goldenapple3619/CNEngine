name: build

on: [push, pull_request]

jobs:
  build-linux-i386:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v2

      - name: Cache CMake build
        uses: actions/cache@v3
        with:
          path: |
            build/linux-i386
            ~/.cmake
            ~/.cache/fetchcontent
          key: cmake-build-${{ runner.os }}-linux-i386-${{ hashFiles('**/CMakeLists.txt') }}
          restore-keys: |
            cmake-build-${{ runner.os }}-linux-i386-

      - name: Install NASM
        run: sudo apt update && sudo apt install -y nasm

      - name: Install 32-bit build dependencies
        run: |
          sudo dpkg --add-architecture i386
          sudo apt update
          sudo apt install -y gcc-multilib g++-multilib libc6-dev-i386 lib32z1 lib32ncurses6 lib32gcc-s1

      - name: Build linux-i386
        run: |
          scripts/build_linux-i386.sh

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-linux-i386
          path: dist/linux-i386

  build-linux-amd64:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v2
      
      - name: Cache CMake build
        uses: actions/cache@v3
        with:
          path: |
            build/linux-amd64
            ~/.cmake
            ~/.cache/fetchcontent
          key: cmake-build-${{ runner.os }}-linux-amd64-${{ hashFiles('**/CMakeLists.txt') }}
          restore-keys: |
            cmake-build-${{ runner.os }}-linux-amd64-

      - name: Install NASM
        run: sudo apt update && sudo apt install -y nasm

      - name: Build linux-amd64
        run: |
          scripts/build_linux-amd64.sh

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-linux-amd64
          path: dist/linux-amd64

  build-windows-i386:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v2

      - name: Cache CMake build
        uses: actions/cache@v3
        with:
          path: |
            build/windows-i386
            %USERPROFILE%\.cmake
            %USERPROFILE%\.cache\fetchcontent
          key: cmake-build-${{ runner.os }}-windows-i386-${{ hashFiles('**/CMakeLists.txt') }}
          restore-keys: |
            cmake-build-${{ runner.os }}-windows-i386-

      - name: Install mingw
        run: |
          choco install msys2 -y

          $msys2Path = "${env:ProgramFiles}\msys2\usr\bin"
          $env:Path = "$msys2Path;$env:Path"

          C:\tools\msys64\usr\bin\bash.exe -lc "pacman -Syu --noconfirm"
          C:\tools\msys64\usr\bin\bash.exe -lc "pacman -S --noconfirm mingw-w64-i686-toolchain base-devel"

          copy C:\msys64\mingw64\bin\windres.exe C:\msys64\mingw64\bin\i686-w64-mingw32-windres.exe

          dir C:\msys64\mingw32\bin
          dir C:\msys64\mingw64\bin

          $env:Path = "C:\msys64\mingw32\bin;C:\msys64\mingw64\bin;$env:Path"

      - name: Build windows-i386
        run: |
          cmd.exe /c scripts\build_windows-i386.bat
        shell: powershell

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-windows-i386
          path: dist/windows-i386

  build-windows-amd64:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v2

      - name: Cache CMake build
        uses: actions/cache@v3
        with:
          path: |
            build/windows-amd64
            %USERPROFILE%\.cmake
            %USERPROFILE%\.cache\fetchcontent
          key: cmake-build-${{ runner.os }}-windows-amd64-${{ hashFiles('**/CMakeLists.txt') }}
          restore-keys: |
            cmake-build-${{ runner.os }}-windows-amd64-

      - name: Install mingw
        run: |
          choco install msys2 -y

          $msys2Path = "${env:ProgramFiles}\msys2\usr\bin"
          $env:Path = "$msys2Path;$env:Path"

          C:\tools\msys64\usr\bin\bash.exe -lc "pacman -Syu --noconfirm"
          C:\tools\msys64\usr\bin\bash.exe -lc "pacman -S --noconfirm mingw-w64-x86_64-toolchain base-devel"

          copy C:\msys64\mingw64\bin\windres.exe C:\msys64\mingw64\bin\x86_64-w64-mingw32-windres.exe

          dir C:\msys64\mingw32\bin
          dir C:\msys64\mingw64\bin

          $env:Path = "C:\msys64\mingw32\bin;C:\msys64\mingw64\bin;$env:Path"
        shell: powershell

      - name: Build windows-amd64
        run: |
          cmd.exe /c scripts\build_windows-amd64.bat
        shell: powershell

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-windows-amd64
          path: dist/windows-amd64

  build-macos-amd64:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v2

      - name: Cache CMake build
        uses: actions/cache@v3
        with:
          path: |
            build/macos-amd64
            ~/.cmake
            ~/.cache/fetchcontent
          key: cmake-build-${{ runner.os }}-macos-amd64-${{ hashFiles('**/CMakeLists.txt') }}
          restore-keys: |
            cmake-build-${{ runner.os }}-macos-amd64-

      - name: Install NASM
        run: brew install nasm

      - name: Build macos-amd64
        run: |
          scripts/build_macos-amd64.sh

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-macos-amd64
          path: dist/macos-amd64
