name: tests

on:
  workflow_run:
    workflows: ["build"]
    types: [completed]

jobs:
  test-linux-amd64:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      - uses: actions/checkout@v2
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: dist-linux-amd64
          path: ./dist
      - name: Run tests
        run: |
          ls -R ./dist
