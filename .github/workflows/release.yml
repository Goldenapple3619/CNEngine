name: release

on:
  workflow_run:
    workflows: ["build"]
    branches:
      - dev
      - main
    types:
      - completed

jobs:
  versioning:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    outputs:
      tag: ${{ steps.info.outputs.tag }}
      name: ${{ steps.info.outputs.name }}
      prerelease: ${{ steps.info.outputs.prerelease }}
      version: ${{ steps.info.outputs.version }}
    steps:
      - name: Set release info
        id: info
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH="${{ github.event.workflow_run.head_branch }}"

          LATEST=$(gh release list \
            --repo ${{ github.repository }} \
            --json tagName \
            --jq '[.[] | select(.tagName | test("^v[0-9]+\\.[0-9]+\\.[0-9]+-(dev|stable)$"))] | sort_by(.tagName) | last | .tagName' \
            2>/dev/null)

          if [ -z "$LATEST" ] || [ "$LATEST" = "null" ]; then
            LATEST="v1.0.0"
          fi

          BASE=$(echo "$LATEST" | sed -E 's/-(dev|stable)$//')
          MAJOR=$(echo "$BASE" | cut -d. -f1 | tr -d 'v')
          MINOR=$(echo "$BASE" | cut -d. -f2)
          PATCH=$(echo "$BASE" | cut -d. -f3)

          if [ "$BRANCH" = "main" ]; then
            MINOR=$((MINOR + 1))
            PATCH=0
            TAG="v${MAJOR}.${MINOR}.${PATCH}-stable"
            NAME="Stable Release $TAG"
            PRERELEASE="false"
          else
            PATCH=$((PATCH + 1))
            TAG="v${MAJOR}.${MINOR}.${PATCH}-dev"
            NAME="Dev Release $TAG"
            PRERELEASE="true"
          fi

          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "name=$NAME" >> $GITHUB_OUTPUT
          echo "prerelease=$PRERELEASE" >> $GITHUB_OUTPUT
          echo "version=${MAJOR}.${MINOR}.${PATCH}" >> $GITHUB_OUTPUT

  package-windows:
    needs: versioning
    runs-on: windows-latest
    strategy:
      matrix:
        arch: [amd64, i386]
    steps:
      - uses: actions/checkout@v2

      - name: Download raw build artifact
        uses: actions/download-artifact@v4
        with:
          name: dist-windows-${{ matrix.arch }}
          path: payload
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Stage install layout
        shell: bash
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          set -e
          PLATFORM_DIR="windows-${ARCH}"

          mkdir -p stage
          mkdir -p "stage/platform/${PLATFORM_DIR}/include"
          mkdir -p "stage/platform/${PLATFORM_DIR}/lib"
          mkdir -p stage/assets

          cp payload/bin/cn_engine.exe stage/

          cp -r payload/lib/. stage/

          cp -r payload/include/. "stage/platform/${PLATFORM_DIR}/include/"
          cp -r payload/lib/. "stage/platform/${PLATFORM_DIR}/lib/"

          cp -r assets/. stage/assets/

      - name: Generate config.xml
        shell: bash
        env:
          VERSION: ${{ needs.versioning.outputs.version }}
          ARCH: ${{ matrix.arch }}
        run: |
          cat > stage/assets/config.xml << EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <engine>
              <submodules>${ENGINE_ROOT}/assets/submodules</submodules>
              <ressources>
                  <set machine="linux" architecture="amd64">
                      <includes>${ENGINE_ROOT}/platform/linux-amd64/include</includes>
                      <libs>${ENGINE_ROOT}/platform/linux-amd64/lib</libs>
                      <toolchain>gcc</toolchain>
                  </set>

                  <set machine="macos" architecture="amd64">
                      <includes>${ENGINE_ROOT}/platform/macos-arm64/include</includes>
                      <libs>${ENGINE_ROOT}/platform/macos-arm64/lib</libs>
                      <toolchain>gcc</toolchain>
                  </set>

                  <set machine="win" architecture="amd64">
                      <includes>${ENGINE_ROOT}/platform/windows-amd64/include</includes>
                      <libs>${ENGINE_ROOT}/platform/windows-amd64/lib</libs>
                      <toolchain>x86_64-w64-mingw32-gcc</toolchain>
                  </set>
              </ressources>
              <generator>
                  <include>${ENGINE_ROOT}/assets/generator/engine_main.h</include>

                  <src>${ENGINE_ROOT}/assets/generator/main.c</src>
                  <src>${ENGINE_ROOT}/assets/generator/submodules.c</src>

                  <src forsubmodule="assets">${ENGINE_ROOT}/assets/generator/submodules/assets/api.c</src>
                  <src forsubmodule="assets">${ENGINE_ROOT}/assets/generator/submodules/assets/raw_ressources.c</src>

                  <src forsubmodule="graphics">${ENGINE_ROOT}/assets/generator/submodules/graphics.c</src>
              </generator>
          </engine>
          EOF

      - name: Generate placeholder license
        shell: bash
        run: |
          cat > license.rtf << 'EOF'
          {\rtf1\ansi
          Copyright (c) 2026 Goldenapple3619\par
          \par
          THIS LICENSE IS A LEGAL CONTRACT BETWEEN YOU (“LICENSEE”) AND THE COPYRIGHT OWNER (“LICENSOR”).\par
          \par
          1. Grant of Rights\par
          Licensor grants Licensee the limited right to view and study the source code for personal, non-commercial purposes **only**.\par
          No other rights (including, but not limited to, modification, distribution, or commercial exploitation) are granted.\par
          \par
          2. Prohibited Uses\par
          Licensee may not:\par
            a) use the code in any commercial product or service;\par
            b) reproduce, copy, publish, redistribute, sublicense, sell, lease, rent or otherwise distribute the code;\par
            c) modify, translate, adapt the code;\par
            d) use the code for benchmarking, training, or machine learning purposes.\par
          \par
          3. Reservation of Rights\par
          All rights not expressly granted to Licensee are hereby reserved by Licensor.\par
          \par
          4. Termination\par
          Any unauthorized use immediately terminates this license without notice.\par
          }
          EOF

      - name: Generate WiX product definition
        shell: bash
        env:
          VERSION: ${{ needs.versioning.outputs.version }}
          ARCH: ${{ matrix.arch }}
        run: |
          WIX_ARCH="x86"
          [ "$ARCH" = "amd64" ] && WIX_ARCH="x64"

          cat > product.wxs << EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <Wix xmlns="http://schemas.microsoft.com/wix/2006/wi">
            <Product Id="*"
                     Name="CNEngine"
                     Language="1033"
                     Version="$VERSION"
                     Manufacturer="CNStudio"
                     UpgradeCode="4481d804-cc15-4350-bc94-c57e201614cf">
              <Package InstallerVersion="500" Compressed="yes" InstallScope="perMachine" Platform="$WIX_ARCH" />
              <MajorUpgrade DowngradeErrorMessage="A newer version of CNEngine is already installed." />
              <MediaTemplate EmbedCab="yes" />

              <Directory Id="TARGETDIR" Name="SourceDir">
                <Directory Id="ProgramFilesFolder">
                  <Directory Id="INSTALLFOLDER" Name="CNEngine" />
                </Directory>
                <Directory Id="ProgramMenuFolder">
                  <Directory Id="ApplicationProgramsFolder" Name="CNEngine" />
                </Directory>
                <Directory Id="DesktopFolder" Name="Desktop" />
              </Directory>

              <DirectoryRef Id="ApplicationProgramsFolder">
                <Component Id="StartMenuShortcutComponent" Guid="*">
                  <Shortcut Id="StartMenuShortcut"
                            Name="CNEngine"
                            Description="Launch CNEngine"
                            Target="[INSTALLFOLDER]cn_engine.exe"
                            WorkingDirectory="INSTALLFOLDER" />
                  <RemoveFolder Id="RemoveApplicationProgramsFolder" On="uninstall" />
                  <RegistryValue Root="HKCU" Key="Software\CNStudio\CNEngine" Name="startmenu_shortcut" Type="integer" Value="1" KeyPath="yes" />
                </Component>
              </DirectoryRef>

              <DirectoryRef Id="DesktopFolder">
                <Component Id="DesktopShortcutComponent" Guid="*">
                  <Shortcut Id="DesktopShortcut"
                            Name="CNEngine"
                            Description="Launch CNEngine"
                            Target="[INSTALLFOLDER]cn_engine.exe"
                            WorkingDirectory="INSTALLFOLDER" />
                  <RegistryValue Root="HKCU" Key="Software\CNStudio\CNEngine" Name="desktop_shortcut" Type="integer" Value="1" KeyPath="yes" />
                </Component>
              </DirectoryRef>

              <Feature Id="MainFeature" Title="CNEngine" Level="1" Absent="disallow">
                <ComponentGroupRef Id="AppFiles" />
              </Feature>

              <Feature Id="StartMenuShortcutFeature" Title="Start Menu Shortcut" Description="Add a shortcut to the Start Menu" Level="1">
                <ComponentRef Id="StartMenuShortcutComponent" />
              </Feature>

              <Feature Id="DesktopShortcutFeature" Title="Desktop Shortcut" Description="Add a shortcut to the Desktop" Level="1">
                <ComponentRef Id="DesktopShortcutComponent" />
              </Feature>

              <UIRef Id="WixUI_FeatureTree" />
              <UIRef Id="WixUI_ErrorProgressText" />
              <WixVariable Id="WixUILicenseRtf" Value="license.rtf" />
            </Product>
          </Wix>
          EOF

      - name: Harvest staged files
        shell: cmd
        run: |
          "%WIX%bin\heat.exe" dir stage -out files.wxs -gg -sfrag -srd -ke -cg AppFiles -dr INSTALLFOLDER -var var.PayloadDir

      - name: Compile and link MSI
        shell: cmd
        run: |
          "%WIX%bin\candle.exe" -dPayloadDir=stage product.wxs files.wxs -o obj\
          "%WIX%bin\light.exe" obj\product.wixobj obj\files.wixobj -o CNEngine-windows-${{ matrix.arch }}.msi -ext WixUtilExtension -ext WixUIExtension

      - name: Upload MSI
        uses: actions/upload-artifact@v4
        with:
          name: installer-windows-${{ matrix.arch }}
          path: CNEngine-windows-${{ matrix.arch }}.msi

  package-linux:
    needs: versioning
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [amd64, i386]
    steps:
      - name: Download raw build artifact
        uses: actions/download-artifact@v4
        with:
          name: dist-linux-${{ matrix.arch }}
          path: payload
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install fpm
        run: |
          sudo apt-get update
          sudo apt-get install -y ruby ruby-dev build-essential rpm
          sudo gem install --no-document fpm

      - name: Map architecture names
        id: arch
        run: |
          if [ "${{ matrix.arch }}" = "amd64" ]; then
            echo "deb_arch=amd64" >> $GITHUB_OUTPUT
            echo "rpm_arch=x86_64" >> $GITHUB_OUTPUT
          else
            echo "deb_arch=i386" >> $GITHUB_OUTPUT
            echo "rpm_arch=i686" >> $GITHUB_OUTPUT
          fi

      - name: Build .deb and .rpm
        env:
          VERSION: ${{ needs.versioning.outputs.version }}
        run: |
          fpm -s dir -t deb \
            -n cnengine -v "$VERSION" -a ${{ steps.arch.outputs.deb_arch }} \
            --prefix /opt/cnengine \
            --maintainer "dev@cnstudio.dev" \
            --description "CNEngine" \
            -C payload .

          fpm -s dir -t rpm \
            -n cnengine -v "$VERSION" -a ${{ steps.arch.outputs.rpm_arch }} \
            --prefix /opt/cnengine \
            --maintainer "dev@cnstudio.dev" \
            --description "CNEngine" \
            -C payload .

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: installer-linux-${{ matrix.arch }}
          path: |
            *.deb
            *.rpm

  package-macos:
    needs: versioning
    runs-on: macos-latest
    steps:
      - name: Download raw build artifact
        uses: actions/download-artifact@v4
        with:
          name: dist-macos-arm64
          path: payload
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build .pkg
        env:
          VERSION: ${{ needs.versioning.outputs.version }}
        run: |
          pkgbuild --root payload \
            --identifier com.cnstudio.cnengine \
            --version "$VERSION" \
            --install-location /Applications/CNEngine \
            CNEngine-macos-arm64.pkg

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: installer-macos-arm64
          path: CNEngine-macos-arm64.pkg

  release:
    needs: [versioning, package-windows, package-linux, package-macos]
    runs-on: ubuntu-latest
    steps:
      - name: Download raw build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: dist-*
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download installer artifacts
        uses: actions/download-artifact@v4
        with:
          path: installers
          pattern: installer-*

      - name: Zip raw dist folders
        run: |
          cd dist
          for dir in */; do
            zip -r "${dir%/}.zip" "$dir"
          done

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.versioning.outputs.tag }}
          name: ${{ needs.versioning.outputs.name }}
          prerelease: ${{ needs.versioning.outputs.prerelease }}
          files: |
            dist/*.zip
            installers/*/*