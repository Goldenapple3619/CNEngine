name: test

on:
  pull_request:
    branches: [dev, main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  test-linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            nasm ccache libgl1-mesa-dev libglu1-mesa-dev libglx-dev \
            libx11-dev libxext-dev uuid-dev libcriterion-dev

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install gcovr
        run: pip install gcovr

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: |
            build/linux-amd64-test
            ~/.cmake
            ~/.cache/fetchcontent
            ~/.cache/ccache
          key: ccache-${{ runner.os }}-${{ hashFiles('**/CMakeLists.txt') }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ runner.os }}-${{ hashFiles('**/CMakeLists.txt') }}-
            ccache-${{ runner.os }}-

      - name: Build
        env:
          CMAKE_C_COMPILER_LAUNCHER: ccache
          CMAKE_CXX_COMPILER_LAUNCHER: ccache
          CMAKE_BUILD_PARALLEL_LEVEL: 4
        run: |
          sh ./scripts/build_linux-amd64-test.sh
          ccache --show-stats

      - name: Test
        run: ctest --test-dir build/linux-amd64-test --output-on-failure --parallel

      - name: Generate coverage
        run: gcovr -r . build/linux-amd64-test/lib --xml-pretty --xml -o coverage.xml --print-summary

      - name: Upload coverage
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

      - name: Upload test logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs
          path: build/linux-amd64-test/Testing/Temporary/LastTest.log
          if-no-files-found: ignore
